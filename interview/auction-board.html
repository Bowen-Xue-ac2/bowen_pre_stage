:root{color-scheme:dark;--bg:#0c110f;--panel:#131a17;--line:#32443b;--paper:#e3ede5;--muted:#a1b0a6;--green:#a9f4b0;--mono:'Interview OCR B','OCR A Std',ui-monospace,'Microsoft YaHei',monospace;font:15px/1.5 var(--mono);color:var(--paper);background:var(--bg)}
*{box-sizing:border-box}body{margin:0}button,input,select,textarea{font:inherit;color:inherit}button,select,input,textarea{background:#17221b;border:1px solid var(--line);border-radius:4px}button,select{cursor:pointer}button{padding:7px 11px}button:hover,button[aria-pressed=true]{border-color:var(--green);color:var(--green)}:focus-visible{outline:2px solid var(--green);outline-offset:2px}[hidden]{display:none!important}
html,body,main{height:100%;margin:0}.sr-only{position:absolute;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;clip-path:inset(50%)}.foot,.editor,.shelf-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.shelf-head{justify-content:space-between;margin-bottom:10px}.shelf-head button{font-size:13px;padding:4px 9px}.foot{font-size:13px;color:var(--muted)}
.studio{height:100%;display:grid;grid-template-columns:220px minmax(0,1fr);border:1px solid var(--line);border-radius:6px;overflow:hidden}.shelf{overflow:auto;background:var(--panel);border-right:1px solid var(--line);padding:14px}.shelf h2,.bar h2{font-size:16px;margin:0}.shelf h3{font-weight:400;margin:15px 0 6px}.palette{display:grid;gap:5px}.chip,.node{--tone:#9cd6e0;--tint:#172b30}.logic{--tone:#dcb3f7;--tint:#2c2035}.record{--tone:#ebc27c;--tint:#30271a}.view{--tone:#a8e6ab;--tint:#1d3023}.free{--tone:#c1c8c6;--tint:#252b28}.chip,.node .body{background:var(--tint);color:var(--tone);border:1px solid color-mix(in srgb,var(--tone) 56%,#1c211e);border-left:4px solid var(--tone);border-radius:5px;cursor:grab;font-size:14px;text-align:left}.chip{padding:4px 9px;touch-action:manipulation}.key{display:inline-block;font-weight:bold;margin-right:9px;opacity:.85}
.work{min-height:0;min-width:0;background:#101713;display:flex;flex-direction:column}.bar,.foot{min-height:44px;padding:7px 12px}.bar{border-bottom:1px solid var(--line)}.helper{font-size:12px}.viewport{overflow:auto;position:relative;min-height:0;height:0;flex:1;scrollbar-color:#49604f #121815}.board{position:relative;width:max(100%,1300px);height:max(100%,900px);background-image:radial-gradient(#304038 1px,transparent 1px);background-size:20px 20px;isolation:isolate}.empty{position:absolute;top:14%;left:clamp(20px,5vw,80px);color:var(--muted);pointer-events:none}.empty b{display:block;color:var(--green);font-size:21px;font-weight:500;margin-bottom:4px}.wires{position:absolute;inset:0;width:100%;height:100%;overflow:visible;pointer-events:none}.wire{stroke:#83a89a;stroke-width:2;fill:none}.wire.selected{stroke:var(--green);stroke-width:3}.hit{stroke:transparent;stroke-width:18;fill:none;pointer-events:stroke;cursor:pointer}.edge-label{fill:#dae9dc;stroke:#101713;stroke-width:5;paint-order:stroke;pointer-events:auto;cursor:pointer;font:13px var(--mono)}.node{position:absolute;width:164px;height:52px;display:flex;align-items:center;justify-content:center}.node .body{width:100%;height:100%;padding:4px 14px;overflow:hidden;text-align:center;line-height:1.25;overflow-wrap:anywhere;touch-action:none}.node.selected .body{outline:2px solid var(--tone);outline-offset:2px}.port{position:absolute;right:-9px;width:19px;height:19px;padding:0;border:2px solid var(--tone);border-radius:50%;background:#111b15;color:var(--tone);font:700 12px/1 monospace}.pending .port{background:var(--green);color:#0c110f}
.foot{border-top:1px solid var(--line);gap:6px}.foot input{width:clamp(120px,17vw,230px);padding:5px 7px}.foot button{padding:4px 8px}.editor{display:flex;align-items:center;gap:7px;flex-wrap:wrap}
@media(max-width:760px){.studio{grid-template-columns:1fr;grid-template-rows:auto minmax(0,1fr)}.shelf{border-right:0;border-bottom:1px solid var(--line);padding:10px}.palette{display:flex;flex-wrap:wrap;gap:5px}.shelf h3{display:none}.shelf h2{margin-bottom:7px}.chip{padding:5px 7px;font-size:13px}.viewport{min-height:0;height:0;flex:1}.helper{width:100%}.tabs button{padding:9px}.top{gap:12px}}
</style></head><body><main>
<section class="studio" id="studio"><aside class="shelf"><div class="shelf-head"><h2>积木台</h2><button id="clear" disabled>清空画布</button></div><div id="palette" class="palette"></div></aside><div class="work"><div class="viewport" id="viewport"><div class="board" id="board"><svg class="wires" aria-label="有向连线"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#a6cabb"/></marker></defs><g id="lines"></g></svg></div></div><div class="foot" id="edit-bar" hidden><div class="editor" id="editor" hidden><label id="edit-label" for="caption"></label><input id="caption" maxlength="40" autocomplete="off"><button id="remove">删除选中项</button></div><button id="cancel" hidden>取消连线</button></div></div></section>
<p class="sr-only" id="notice" role="status"></p>
</main><script>
'use strict';
const $=id=>document.getElementById(id);
const blocks=[
 ['M','学生手动输入','actor'],['A','Agent 建议或代投','actor'],['U','统一业务入口','logic'],
 ['L','积分账本','record'],['E','竞价处理','record'],['Q','结果回查','view'],['V','页面反馈','view'],
 ['S','请求','actor'],['?','条件判断','logic'],['L','预留','record'],['L','结算','record'],
 ['L','释放','record'],['+','自定义','free']
];
const W=164,H=52;
let data={nodes:[],edges:[]},selected=null,source=null,drag=null;
const key='silcai.auction.canvas.v2';
try{
 const draft=JSON.parse(sessionStorage.getItem(key));
 if(draft && Array.isArray(draft.nodes) && Array.isArray(draft.edges) &&
    draft.nodes.every(n=>n && blocks[n.type] && Number.isFinite(n.x) && Number.isFinite(n.y)) &&
    draft.edges.every(e=>draft.nodes.some(n=>n.id===e.from) && draft.nodes.some(n=>n.id===e.to))) data=draft;
}catch{}
function save(){try{sessionStorage.setItem(key,JSON.stringify(data))}catch{}}
const say=msg=>{$('notice').textContent=msg};
const uid=()=>crypto.randomUUID();
function btn(text,action){const b=document.createElement('button');b.textContent=text;b.onclick=action;return b}
function selectItem(kind,id){selected={kind,id};updateEditor()}
function updateEditor(){
 const g=data,item=selected&&g[selected.kind].find(v=>v.id===selected.id);
 $('editor').hidden=!item;$('cancel').hidden=!source;
 if(item){$('edit-label').textContent=selected.kind==='edges'?'连线条件':'积木名称';$('caption').value=item.label}
 for(const el of $('board').querySelectorAll('.node')){el.classList.toggle('selected',selected?.kind==='nodes'&&selected.id===el.dataset.id);el.classList.toggle('pending',el.dataset.id===source)}
 for(const el of $('lines').children)el.firstElementChild.classList.toggle('selected',selected?.kind==='edges'&&selected.id===el.dataset.id);
 $('clear').disabled=!g.nodes.length;
 $('edit-bar').hidden=!item&&!source;
}
function svg(tag,attrs){const e=document.createElementNS('http://www.w3.org/2000/svg',tag);for(const [k,v] of Object.entries(attrs))e.setAttribute(k,v);return e}
function wires(){
 const group=$('lines');group.replaceChildren();
 const nodes=new Map(data.nodes.map(n=>[n.id,n]));
 for(const e of data.edges){
  const a=nodes.get(e.from),b=nodes.get(e.to),dx=b.x-a.x,dy=b.y-a.y;
  const horizontal=Math.abs(dx)/W>=Math.abs(dy)/H,sign=Math.sign(horizontal?dx:dy)||1;
  const ux=horizontal?sign:0,uy=horizontal?0:sign;
  const x1=a.x+W/2+ux*(W/2+2),y1=a.y+H/2+uy*(H/2+2),x2=b.x+W/2-ux*(W/2+4),y2=b.y+H/2-uy*(H/2+4);
  const bend=Math.max(32,Math.abs(horizontal?x2-x1:y2-y1)*.42);
  const d='M '+x1+' '+y1+' C '+[x1+ux*bend,y1+uy*bend,x2-ux*bend,y2-uy*bend,x2,y2].join(' ');
  const line=svg('g',{});line.dataset.id=e.id;
  line.append(svg('path',{d,class:'wire'+(selected?.kind==='edges'&&selected.id===e.id?' selected':''),'marker-end':'url(#arrow)'}));
  const hit=svg('path',{d,class:'hit',tabindex:0,role:'button','aria-label':'编辑连线 '+a.label+' → '+b.label});
  hit.onkeydown=ev=>{if(ev.key==='Enter'){selectItem('edges',e.id);$('caption').focus()}};line.append(hit);
  if(e.label){const label=svg('text',{x:(x1+x2)/2+4,y:(y1+y2)/2-7,class:'edge-label','text-anchor':'middle'});label.textContent=e.label;line.append(label)}
  line.onclick=()=>{source=null;selectItem('edges',e.id)};group.append(line);
 }
}
function connect(to){
 if(!source)return false;
 if(source===to){source=null;updateEditor();say('已取消连线');return true}
 let edge=data.edges.find(e=>e.from===source&&e.to===to);
 if(!edge){edge={id:uid(),from:source,to,label:''};data.edges.push(edge)}
 source=null;selected={kind:'edges',id:edge.id};wires();updateEditor();save();say('已连接，可在下方填写连线条件。');return true;
}
function place(n,x,y){n.x=Math.max(9,Math.min(1300-W-10,Math.round(x)));n.y=Math.max(8,Math.min(900-H-8,Math.round(y)))}
function point(ev){const r=$('board').getBoundingClientRect();return {x:ev.clientX-r.left,y:ev.clientY-r.top}}
function drawNode(n){
 const el=document.createElement('div'),def=blocks[n.type];el.className='node '+def[2];el.dataset.id=n.id;
 const position=()=>{el.style.left=n.x+'px';el.style.top=n.y+'px'};position();
 const body=btn(n.label,()=>{if(!connect(n.id))selectItem('nodes',n.id)});body.className='body';
 body.onpointerdown=ev=>{
  if(ev.button!==0||source)return;
  const p=point(ev);drag={x:p.x-n.x,y:p.y-n.y,id:n.id};body.setPointerCapture(ev.pointerId);selectItem('nodes',n.id)
 };
 body.onpointermove=ev=>{if(drag?.id!==n.id)return;const p=point(ev);place(n,p.x-drag.x,p.y-drag.y);position();wires()};
 body.onlostpointercapture=()=>{if(drag?.id===n.id){drag=null;save()}};
 body.onkeydown=ev=>{const shifts={ArrowLeft:[-12,0],ArrowRight:[12,0],ArrowUp:[0,-12],ArrowDown:[0,12]};const delta=shifts[ev.key];if(delta){ev.preventDefault();place(n,n.x+delta[0],n.y+delta[1]);position();wires();save()}};
 const port=btn('+',()=>{if(source){connect(n.id);return}source=n.id;selectItem('nodes',n.id);say('请选择这条连线的目标积木。')});port.className='port';port.setAttribute('aria-label','从「'+n.label+'」连线');
 el.append(body,port);$('board').append(el);return el;
}
function add(type,x,y){
 const n={id:uid(),type,label:blocks[type][1]};
 if(x==null){const vp=$('viewport'),cols=Math.max(1,Math.floor((vp.clientWidth-28)/(W+28)));let slot=0;
 do{place(n,vp.scrollLeft+28+(slot%cols)*(W+28),vp.scrollTop+24+Math.floor(slot/cols)*82);slot++}while(slot<50&&data.nodes.some(o=>Math.abs(o.x-n.x)<W+6&&Math.abs(o.y-n.y)<H+6))}
 else place(n,x-W/2,y-H/2);
 data.nodes.push(n);source=null;drawNode(n);selectItem('nodes',n.id);save();
}
function render(){
 selected=source=drag=null;
 $('palette').replaceChildren();
 blocks.forEach(([key,name,tone],i)=>{const b=btn('',()=>add(i)),code=document.createElement('span');code.className='key';code.textContent=key;b.append(code,name);b.className='chip '+tone;b.draggable=true;b.ondragstart=ev=>{ev.dataTransfer.setData('application/x-auction-block',String(i));ev.dataTransfer.effectAllowed='copy'};$('palette').append(b)});
 $('board').querySelectorAll('.node').forEach(e=>e.remove());data.nodes.forEach(drawNode);wires();updateEditor();$('viewport').scrollTo(0,0);
}
$('board').ondragover=ev=>{if(ev.dataTransfer.types.includes('application/x-auction-block')){ev.preventDefault();ev.dataTransfer.dropEffect='copy'}};
$('board').ondrop=ev=>{ev.preventDefault();const raw=ev.dataTransfer.getData('application/x-auction-block');if(!/^\d+$/.test(raw)||!blocks[Number(raw)])return;const p=point(ev);add(Number(raw),p.x,p.y)};
$('caption').oninput=()=>{if(!selected)return;const item=data[selected.kind].find(o=>o.id===selected.id);item.label=$('caption').value;if(selected.kind==='nodes'){const el=Array.from($('board').querySelectorAll('.node')).find(el=>el.dataset.id===item.id);el.firstElementChild.textContent=item.label;el.lastElementChild.setAttribute('aria-label','从「'+item.label+'」连线')}wires();save()};
$('remove').onclick=()=>{if(!selected)return;const g=data,{kind,id}=selected;g[kind]=g[kind].filter(o=>o.id!==id);if(kind==='nodes'){g.edges=g.edges.filter(e=>e.from!==id&&e.to!==id);Array.from($('board').querySelectorAll('.node')).find(el=>el.dataset.id===id)?.remove()}source=selected=null;wires();updateEditor();save()};
$('cancel').onclick=()=>{source=null;updateEditor();say('已取消连线')};
$('clear').onclick=()=>{
 data={nodes:[],edges:[]};render();save();say('画布已清空');
};
render();
</script></body></html>
